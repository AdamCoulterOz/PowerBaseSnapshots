name: Capture platform baseline
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Sentinel check, diagnostic discovery, attested capture, or OIDC read proof
        type: choice
        options: [check, diagnose, run, auth-check]
        default: check
        required: true
  schedule:
    - cron: '17 * * * *'
permissions: {}
concurrency:
  group: platform-sentinel-baseline
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    environment: sentinel
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Check and capture sentinel
        env:
          SENTINEL_URL: ${{ secrets.SENTINEL_URL }}
          POWERSPEC_AUTH_MODE: github-oidc
          POWERSPEC_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          POWERSPEC_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          POWERSPEC_INSTRUMENTATION_ROLE_ID: ${{ vars.POWERSPEC_INSTRUMENTATION_ROLE_ID }}
          PRODUCER_SSH_KEY: ${{ secrets.PRODUCER_SSH_KEY }}
          PIPELINE_MODE: ${{ inputs.mode || 'run' }}
        run: python3 pipeline/run.py --workdir "$RUNNER_TEMP" --mode "$PIPELINE_MODE"
